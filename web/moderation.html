<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Moderation Console | Ivris</title>
  <!-- Synchronous FOUC-Prevention Color Scheme Loader (per modern-web-guidance: color-scheme-switching) -->
  <script>
    (function() {
      try {
        var pref = localStorage.getItem('ivris_color_scheme') || 'dark';
        var resolved = pref;
        if (pref === 'system') {
          resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePref = pref;
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) {
          meta.content = pref === 'system' ? 'light dark' : (resolved === 'light' ? 'light only' : 'dark only');
        }
      } catch (_e) {}
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: light dark;
      --ivris-bg: #000000;
      --ivris-surface: #09090b;
      --ivris-surface-alt: #18181b;
      --ivris-border: #27272a;
      --ivris-text: #ffffff;
    }
    html[data-theme="light"] {
      color-scheme: light only;
      --ivris-bg: #ffffff;
      --ivris-surface: #f8fafc;
      --ivris-surface-alt: #f1f5f9;
      --ivris-border: #e2e8f0;
      --ivris-text: #0f172a;
    }
    html[data-theme="dark"] {
      color-scheme: dark only;
    }
    body {
      background-color: var(--ivris-bg);
      color: var(--ivris-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    html[data-theme="light"] body,
    html[data-theme="light"] .bg-black {
      background-color: #ffffff !important;
      color: #0f172a !important;
    }
    html[data-theme="light"] .bg-zinc-950 {
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }
    html[data-theme="light"] .bg-zinc-900,
    html[data-theme="light"] .bg-zinc-900\/90,
    html[data-theme="light"] .bg-zinc-900\/60 {
      background-color: #f1f5f9 !important;
      color: #0f172a !important;
    }
    html[data-theme="light"] .bg-zinc-800 {
      background-color: #e2e8f0 !important;
      color: #0f172a !important;
    }
    html[data-theme="light"] .border-zinc-900,
    html[data-theme="light"] .border-zinc-800 {
      border-color: #e2e8f0 !important;
    }
    html[data-theme="light"] .text-white:not(.bg-sky-500):not(.bg-rose-600):not(.bg-rose-600\/90) {
      color: #0f172a !important;
    }
    html[data-theme="light"] .text-zinc-200,
    html[data-theme="light"] .text-zinc-300 {
      color: #334155 !important;
    }
    html[data-theme="light"] .text-zinc-400,
    html[data-theme="light"] .text-zinc-500 {
      color: #64748b !important;
    }
    .mod-btn {
      min-block-size: 36px;
      min-inline-size: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    @media (pointer: coarse) {
      .mod-btn {
        min-block-size: 42px;
        min-inline-size: 48px;
      }
    }
    /* Responsive Table Pattern (per modern-web-guidance: responsive-table) */
    .table-wrapper {
      overflow: auto;
      max-inline-size: 100%;
      max-block-size: min(560px, 78dvh);
      container-type: inline-size;
      border-radius: 1rem;
      border: 1px solid var(--ivris-border);
      background-color: var(--ivris-surface);
    }
    .table-wrapper:focus-visible {
      outline: 3px solid #38bdf8;
      outline-offset: 3px;
    }
    table.mod-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      text-align: left;
      font-size: 0.75rem;
    }
    table.mod-table thead {
      position: sticky;
      inset-block-start: 0;
      z-index: 1;
      background-color: var(--ivris-surface-alt);
    }
    table.mod-table th,
    table.mod-table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--ivris-border);
      vertical-align: middle;
    }
    table.mod-table tbody th {
      position: sticky;
      inset-inline-start: 0;
      background: var(--ivris-surface);
      font-weight: 600;
      color: var(--ivris-text);
    }
    @container (width < 600px) {
      table.mod-table,
      table.mod-table thead,
      table.mod-table tbody,
      table.mod-table tr,
      table.mod-table th,
      table.mod-table td {
        display: block;
      }
      table.mod-table thead {
        display: none;
      }
      table.mod-table tr {
        margin-block-end: 1rem;
        border: 1px solid var(--ivris-border);
        border-radius: 0.75rem;
        overflow: hidden;
      }
      table.mod-table tbody th {
        position: sticky;
        inset-block-start: 0;
        z-index: 2;
        background: var(--ivris-surface-alt);
      }
      table.mod-table td:nth-child(2)::before {
        content: var(--label-2) ": ";
        font-weight: 600;
        color: #a1a1aa;
      }
      table.mod-table td:nth-child(3)::before {
        content: var(--label-3) ": ";
        font-weight: 600;
        color: #a1a1aa;
      }
      table.mod-table td:nth-child(4)::before {
        content: var(--label-4) ": ";
        font-weight: 600;
        color: #a1a1aa;
      }
      table.mod-table td:nth-child(5)::before {
        content: var(--label-5) ": ";
        font-weight: 600;
        color: #a1a1aa;
      }
    }
  </style>
</head>
<body class="min-h-[100dvh] bg-black text-white antialiased">
  <div id="mod-root" class="max-w-5xl mx-auto px-4 py-6"></div>

  <script>
    const modState = {
      token: localStorage.getItem('ivris_mod_token') || '',
      moderator: null,
      activeTab: 'reports',
      reports: [],
      accountReports: [],
      activePosts: [],
      logs: [],
      users: [],
      userSearch: '',
      error: '',
      statusBanner: '',
    };

    function toggleModTheme() {
      const current = document.documentElement.dataset.theme || 'dark';
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      document.documentElement.dataset.themePref = next;
      try { localStorage.setItem('ivris_color_scheme', next); } catch (_e) {}
      const meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) meta.content = next === 'light' ? 'light only' : 'dark only';
      renderMod();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderAvatarCell(u) {
      const handle = (u && (u.handle || u.author_handle)) || 'U';
      const initials = escapeHtml(handle.slice(0, 2).toUpperCase());
      const avatarUrl = (u && (u.avatar_url || u.author_avatar_url)) || '';
      if (avatarUrl) {
        return `<div class="w-10 h-10 rounded-full bg-zinc-800 overflow-hidden flex items-center justify-center shrink-0"><img src="${escapeHtml(avatarUrl)}" alt="${escapeHtml(handle)}" class="w-full h-full object-cover" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><span style="display:none" class="w-full h-full items-center justify-center font-bold text-xs">${initials}</span></div>`;
      }
      return `<div class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center font-bold text-xs shrink-0">${initials}</div>`;
    }

    function formatTime(ts) {
      if (!ts) return '—';
      return new Date(ts * 1000).toLocaleString();
    }

    async function modFetch(path, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (modState.token) {
        headers['Authorization'] = `Bearer ${modState.token}`;
      }
      const res = await fetch(path, { ...options, headers });
      const data = await res.json();
      return { ok: res.ok, status: res.status, data };
    }

    async function loadDashboard() {
      if (!modState.token) {
        renderMod();
        return;
      }
      const res = await modFetch('/api/moderation/dashboard');
      if (!res.ok) {
        modState.token = '';
        modState.moderator = null;
        localStorage.removeItem('ivris_mod_token');
        modState.error = res.data.error || 'Please sign in with the moderator account.';
        renderMod();
        return;
      }
      modState.moderator = res.data.moderator;
      modState.reports = res.data.reports || [];
      modState.accountReports = res.data.account_reports || [];
      modState.activePosts = res.data.active_posts || [];
      modState.logs = res.data.logs || [];
      modState.users = res.data.users || [];
      if (res.data.auto_deleted_in_sweep > 0) {
        modState.statusBanner = `Automated nudity sweep immediately deleted ${res.data.auto_deleted_in_sweep} violating post(s).`;
      }
      renderMod();
    }

    async function handleModSignIn(e) {
      e.preventDefault();
      modState.error = '';
      const email = document.getElementById('mod-login-id').value.trim();
      const password = document.getElementById('mod-login-pw').value.trim();
      const res = await modFetch('/api/signin', {
        method: 'POST',
        body: JSON.stringify({ email, password }),
      });
      if (!res.ok || !res.data.token) {
        modState.error = res.data.error || 'Invalid credentials.';
        renderMod();
        return;
      }
      modState.token = res.data.token;
      localStorage.setItem('ivris_mod_token', modState.token);
      await loadDashboard();
    }

    function handleModSignOut() {
      modState.token = '';
      modState.moderator = null;
      localStorage.removeItem('ivris_mod_token');
      renderMod();
    }

    async function handleTakeDownPost(postId, customReason) {
      const reason = customReason || 'Removed by Moderator';
      const res = await modFetch('/api/moderation/takedown', {
        method: 'POST',
        body: JSON.stringify({ post_id: postId, reason }),
      });
      if (res.ok) {
        modState.statusBanner = `Post ${postId} and its media files were immediately deleted.`;
      } else {
        modState.statusBanner = res.data.error || 'Could not delete post.';
      }
      await loadDashboard();
    }

    async function handleDismissReport(reportId) {
      await modFetch('/api/moderation/dismiss-report', {
        method: 'POST',
        body: JSON.stringify({ report_id: reportId }),
      });
      modState.statusBanner = `Report ${reportId} dismissed.`;
      await loadDashboard();
    }

    async function handleClearUserProfile(userId, handle, clearAvatar, clearBio) {
      const res = await modFetch('/api/moderation/clear-profile', {
        method: 'POST',
        body: JSON.stringify({
          user_id: userId,
          clear_avatar: Boolean(clearAvatar),
          clear_bio: Boolean(clearBio),
          reason: `Profile photo/bio cleared by moderator for @${handle}`,
        }),
      });
      if (res.ok) {
        modState.statusBanner = `Cleared profile photo/bio for @${handle}.`;
      } else {
        modState.statusBanner = res.data.error || 'Failed to clear profile.';
      }
      await loadDashboard();
    }

    async function handleSyncUpstream() {
      const btn = document.getElementById('mod-sync-btn');
      if (btn) btn.textContent = 'Syncing with cloud...';
      try {
        const res = await modFetch('/api/admin/sync-upstream', { method: 'POST' });
        if (res.ok) {
          modState.statusBanner = res.data.message || 'Synchronized successfully with cloud database!';
        } else {
          modState.statusBanner = res.data.reason || res.data.error || 'Sync completed.';
        }
        await loadDashboard();
      } catch (err) {
        alert('Sync failed: ' + err.message);
      } finally {
        if (btn) btn.textContent = 'Sync Cloud Database';
      }
    }

    async function handleRunNuditySweep() {
      const res = await modFetch('/api/moderation/sweep-nudity', {
        method: 'POST',
        body: JSON.stringify({}),
      });
      if (res.ok) {
        modState.statusBanner = `Nudity scan complete: ${res.data.deleted_count} post(s) deleted.`;
      }
      await loadDashboard();
    }

    async function handleDeleteUser(userId, handle) {
      const res = await modFetch('/api/moderation/delete-user', {
        method: 'POST',
        body: JSON.stringify({
          user_id: userId,
          reason: `Account @${handle} removed by moderator`,
        }),
      });
      if (res.ok) {
        modState.statusBanner = `Account @${handle} and all associated posts/files were deleted.`;
      }
      await loadDashboard();
    }

    function setModTab(tab) {
      modState.activeTab = tab;
      renderMod();
    }

    function renderMod() {
      const root = document.getElementById('mod-root');
      const isLight = (document.documentElement.dataset.theme || 'dark') === 'light';

      if (!modState.moderator) {
        root.innerHTML = `
          <div class="flex justify-end mb-4">
            <button onclick="toggleModTheme()" class="mod-btn px-3.5 py-1.5 rounded-xl bg-zinc-900 border border-zinc-800 text-xs font-semibold">
              ${isLight ? '🌙 Dark mode' : '☀️ Light mode'}
            </button>
          </div>
          <main class="max-w-sm mx-auto my-12 p-6 rounded-2xl bg-zinc-900/90 border border-zinc-800 space-y-5">
            <div class="space-y-1 text-center">
              <h1 class="text-2xl font-bold tracking-tight" style="font-family: Georgia, serif;">Ivris Moderation</h1>
              <p class="text-xs text-zinc-400">Sign in with your moderator account to review reports and enforce teen &amp; adult safety rules.</p>
            </div>

            ${modState.error ? `
              <div role="alert" class="p-3 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-400 text-xs">
                ${escapeHtml(modState.error)}
              </div>
            ` : ''}

            <form onsubmit="handleModSignIn(event)" class="space-y-3.5">
              <div>
                <label for="mod-login-id" class="block text-xs text-zinc-300 font-medium mb-1">Moderator username or email</label>
                <input id="mod-login-id" type="text" required autocomplete="username" value="moderator" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-xs text-white focus:outline-none focus:border-zinc-600" />
              </div>
              <div>
                <label for="mod-login-pw" class="block text-xs text-zinc-300 font-medium mb-1">Password</label>
                <input id="mod-login-pw" type="password" required autocomplete="current-password" placeholder="Enter moderator password" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-xs text-white focus:outline-none focus:border-zinc-600" />
              </div>
              <button type="submit" class="mod-btn w-full py-2.5 rounded-xl bg-sky-500 text-white text-xs font-semibold">
                Sign In to Moderation Console
              </button>
            </form>
          </main>
        `;
        return;
      }

      const openPostReportsCount = modState.reports.filter(r => r.status === 'open').length;
      const openAccountReportsCount = modState.accountReports.filter(r => r.status === 'open').length;
      const autoNudityCount = modState.logs.filter(l => l.action === 'auto_deleted_nudity').length;

      let tabContent = '';

      if (modState.activeTab === 'reports') {
        tabContent = `
          <div tabindex="0" role="region" aria-labelledby="reports-table-caption" class="table-wrapper">
            <table class="mod-table" style="--label-2: 'Author'; --label-3: 'Reason & Caption'; --label-4: 'Status'; --label-5: 'Action';">
              <caption id="reports-table-caption" class="px-4 py-3 text-left text-xs font-semibold text-zinc-300 border-b border-zinc-800 bg-zinc-900/60">
                Reported Posts Queue (${openPostReportsCount} open)
              </caption>
              <thead>
                <tr>
                  <th scope="col">Post / Preview</th>
                  <th scope="col">Author</th>
                  <th scope="col">Reason &amp; Caption</th>
                  <th scope="col">Status</th>
                  <th scope="col">Action</th>
                </tr>
              </thead>
              <tbody>
                ${modState.reports.length === 0 ? `
                  <tr>
                    <th scope="row" colspan="5" class="text-center text-zinc-500 py-8">No reported posts in the queue.</th>
                  </tr>
                ` : modState.reports.map(r => `
                  <tr>
                    <th scope="row">
                      <div class="flex items-center gap-3">
                        ${r.media_url ? `<img src="${escapeHtml(r.media_url)}" alt="Reported post media" class="w-12 h-12 rounded-lg object-cover bg-zinc-800 shrink-0" />` : `<div class="w-12 h-12 rounded-lg bg-zinc-800 flex items-center justify-center text-xs text-zinc-500 shrink-0">Removed</div>`}
                        <div>
                          <div class="font-mono text-xs text-zinc-300">${escapeHtml(r.post_id)}</div>
                          <div class="text-xs text-zinc-500">${formatTime(r.created_at)}</div>
                        </div>
                      </div>
                    </th>
                    <td>@${escapeHtml(r.author_handle || 'deleted')}</td>
                    <td>
                      <div class="font-semibold text-rose-400">${escapeHtml(r.reason)}</div>
                      <div class="text-zinc-400 truncate max-w-xs">${escapeHtml(r.caption || r.details || '—')}</div>
                    </td>
                    <td>
                      <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${r.status === 'open' ? 'bg-amber-500/20 text-amber-300' : 'bg-zinc-800 text-zinc-400'}">
                        ${escapeHtml(r.status)}
                      </span>
                    </td>
                    <td>
                      ${r.status === 'open' && r.media_url ? `
                        <div class="flex flex-wrap gap-2">
                          <button onclick="handleTakeDownPost('${escapeHtml(r.post_id)}', 'Taken down from report: ${escapeHtml(r.reason)}')" class="mod-btn px-3 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-semibold">
                            Take Down Immediately
                          </button>
                          <button onclick="handleDismissReport('${escapeHtml(r.id)}')" class="mod-btn px-3 py-1.5 rounded-lg bg-zinc-800 text-zinc-200 text-xs font-semibold">
                            Dismiss
                          </button>
                        </div>
                      ` : `<span class="text-zinc-500">Resolved</span>`}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else if (modState.activeTab === 'account_reports') {
        tabContent = `
          <div tabindex="0" role="region" aria-labelledby="account-reports-caption" class="table-wrapper">
            <table class="mod-table" style="--label-2: 'Reported By'; --label-3: 'Reason & Bio'; --label-4: 'Status'; --label-5: 'Action';">
              <caption id="account-reports-caption" class="px-4 py-3 text-left text-xs font-semibold text-zinc-300 border-b border-zinc-800 bg-zinc-900/60">
                Reported Accounts Queue (${openAccountReportsCount} open)
              </caption>
              <thead>
                <tr>
                  <th scope="col">Account</th>
                  <th scope="col">Reported By</th>
                  <th scope="col">Reason &amp; Bio</th>
                  <th scope="col">Status</th>
                  <th scope="col">Action</th>
                </tr>
              </thead>
              <tbody>
                ${modState.accountReports.length === 0 ? `
                  <tr>
                    <th scope="row" colspan="5" class="text-center text-zinc-500 py-8">No reported accounts in the queue.</th>
                  </tr>
                ` : modState.accountReports.map(r => `
                  <tr>
                    <th scope="row">
                      <div class="flex items-center gap-3">
                        ${renderAvatarCell({ handle: r.author_handle, avatar_url: r.author_avatar_url })}
                        <div>
                          <div class="font-semibold">@${escapeHtml(r.author_handle || 'deleted')}</div>
                          <div class="text-xs text-zinc-400">${escapeHtml(r.author_display_name || '')}</div>
                        </div>
                      </div>
                    </th>
                    <td>@${escapeHtml(r.reporter_handle || 'anonymous')}</td>
                    <td>
                      <div class="font-semibold text-rose-400">${escapeHtml(r.reason)}</div>
                      <div class="text-zinc-400 truncate max-w-xs">${escapeHtml(r.author_bio || r.details || '—')}</div>
                    </td>
                    <td>
                      <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${r.status === 'open' ? 'bg-amber-500/20 text-amber-300' : 'bg-zinc-800 text-zinc-400'}">
                        ${escapeHtml(r.status)}
                      </span>
                    </td>
                    <td>
                      ${r.status === 'open' ? `
                        <div class="flex flex-wrap gap-2">
                          ${r.target_user_id ? `
                            <button onclick="handleClearUserProfile('${escapeHtml(r.target_user_id)}', '${escapeHtml(r.author_handle)}', true, true)" class="mod-btn px-3 py-1.5 rounded-lg bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs font-semibold">
                              Clear Photo/Bio
                            </button>
                            <button onclick="if(confirm('Remove @${escapeHtml(r.author_handle)}?'))handleDeleteUser('${escapeHtml(r.target_user_id)}', '${escapeHtml(r.author_handle)}')" class="mod-btn px-3 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-semibold">
                              Remove Account
                            </button>
                          ` : ''}
                          <button onclick="handleDismissReport('${escapeHtml(r.id)}')" class="mod-btn px-3 py-1.5 rounded-lg bg-zinc-800 text-zinc-200 text-xs font-semibold">
                            Dismiss
                          </button>
                        </div>
                      ` : `<span class="text-zinc-500">Resolved</span>`}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else if (modState.activeTab === 'posts') {
        tabContent = `
          <div tabindex="0" role="region" aria-labelledby="active-posts-caption" class="table-wrapper">
            <table class="mod-table" style="--label-2: 'Author'; --label-3: 'Caption'; --label-4: 'Created'; --label-5: 'Action';">
              <caption id="active-posts-caption" class="px-4 py-3 text-left text-xs font-semibold text-zinc-300 border-b border-zinc-800 bg-zinc-900/60">
                All Active Posts &amp; Stories (${modState.activePosts.length})
              </caption>
              <thead>
                <tr>
                  <th scope="col">Media</th>
                  <th scope="col">Author</th>
                  <th scope="col">Caption</th>
                  <th scope="col">Created</th>
                  <th scope="col">Action</th>
                </tr>
              </thead>
              <tbody>
                ${modState.activePosts.length === 0 ? `
                  <tr>
                    <th scope="row" colspan="5" class="text-center text-zinc-500 py-8">No active posts on Ivris.</th>
                  </tr>
                ` : modState.activePosts.map(p => `
                  <tr>
                    <th scope="row">
                      <div class="flex items-center gap-3">
                        <img src="${escapeHtml(p.media_url)}" alt="Post preview by ${escapeHtml(p.author_handle)}" class="w-12 h-12 rounded-lg object-cover bg-zinc-800 shrink-0" />
                        <span class="font-mono text-xs text-zinc-300">${escapeHtml(p.id)}</span>
                      </div>
                    </th>
                    <td>@${escapeHtml(p.author_handle)}</td>
                    <td class="max-w-xs truncate text-zinc-300">${escapeHtml(p.caption || '—')}</td>
                    <td class="text-zinc-400">${formatTime(p.created_at)}</td>
                    <td>
                      <button onclick="handleTakeDownPost('${escapeHtml(p.id)}', 'Immediate moderator takedown')" class="mod-btn px-3 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-semibold">
                        Take Down
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else if (modState.activeTab === 'logs') {
        tabContent = `
          <div tabindex="0" role="region" aria-labelledby="logs-table-caption" class="table-wrapper">
            <table class="mod-table" style="--label-2: 'Author'; --label-3: 'Reason'; --label-4: 'Moderator'; --label-5: 'Time';">
              <caption id="logs-table-caption" class="px-4 py-3 text-left text-xs font-semibold text-zinc-300 border-b border-zinc-800 bg-zinc-900/60">
                Auto-Deleted Nudity &amp; Takedown Audit Log (${modState.logs.length})
              </caption>
              <thead>
                <tr>
                  <th scope="col">Action</th>
                  <th scope="col">Account</th>
                  <th scope="col">Reason</th>
                  <th scope="col">Enforced By</th>
                  <th scope="col">Timestamp</th>
                </tr>
              </thead>
              <tbody>
                ${modState.logs.length === 0 ? `
                  <tr>
                    <th scope="row" colspan="5" class="text-center text-zinc-500 py-8">No moderation events logged yet.</th>
                  </tr>
                ` : modState.logs.map(l => `
                  <tr>
                    <th scope="row">
                      <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${l.action === 'auto_deleted_nudity' ? 'bg-rose-500/20 text-rose-300' : 'bg-sky-500/20 text-sky-300'}">
                        ${escapeHtml(l.action)}
                      </span>
                    </th>
                    <td>@${escapeHtml(l.author_handle || 'unknown')}</td>
                    <td class="text-zinc-300">${escapeHtml(l.reason)}</td>
                    <td class="font-mono text-zinc-400">${escapeHtml(l.moderator_id)}</td>
                    <td class="text-zinc-400">${formatTime(l.created_at)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else if (modState.activeTab === 'users') {
        const q = (modState.userSearch || '').toLowerCase();
        const filteredUsers = modState.users.filter(u =>
          !q ||
          (u.handle || '').toLowerCase().includes(q) ||
          (u.display_name || '').toLowerCase().includes(q) ||
          (u.email || '').toLowerCase().includes(q)
        );
        tabContent = `
          <div class="mb-3">
            <input type="text" value="${escapeHtml(modState.userSearch)}" oninput="modState.userSearch=this.value;renderMod()" placeholder="Search accounts by username, name, or email..." class="w-full max-w-md px-3.5 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-xs text-white focus:outline-none" />
          </div>
          <div tabindex="0" role="region" aria-labelledby="users-table-caption" class="table-wrapper">
            <table class="mod-table" style="--label-2: 'Name & Bio'; --label-3: 'Email'; --label-4: 'Stats'; --label-5: 'Action';">
              <caption id="users-table-caption" class="px-4 py-3 text-left text-xs font-semibold text-zinc-300 border-b border-zinc-800 bg-zinc-900/60">
                Registered Accounts (${filteredUsers.length})
              </caption>
              <thead>
                <tr>
                  <th scope="col">Account</th>
                  <th scope="col">Name &amp; Bio</th>
                  <th scope="col">Email</th>
                  <th scope="col">Stats</th>
                  <th scope="col">Action</th>
                </tr>
              </thead>
              <tbody>
                ${filteredUsers.length === 0 ? `
                  <tr>
                    <th scope="row" colspan="5" class="text-center text-zinc-500 py-8">No user accounts found.</th>
                  </tr>
                ` : filteredUsers.map(u => `
                  <tr>
                    <th scope="row">
                      <div class="flex items-center gap-3">
                        ${renderAvatarCell(u)}
                        <div class="space-y-1">
                          <div class="flex items-center gap-1.5 flex-wrap">
                            <span>@${escapeHtml(u.handle)}</span>
                            ${u.email_confirmed
                              ? '<span class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 text-[10px] font-semibold">Verified</span>'
                              : '<span class="px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 text-[10px] font-semibold">Pending</span>'}
                            ${u.is_verified_institution ? '<span class="px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-300 text-[10px] font-semibold">Institution</span>' : ''}
                            ${u.open_reports_count > 0 ? `<span class="px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-400 text-[10px] font-semibold">${u.open_reports_count} Report(s)</span>` : ''}
                          </div>
                        </div>
                      </div>
                    </th>
                    <td>
                      <div class="font-semibold">${escapeHtml(u.display_name)}</div>
                      ${u.bio ? `<div class="text-zinc-400 text-[11px] max-w-xs truncate">${escapeHtml(u.bio)}</div>` : ''}
                    </td>
                    <td class="text-zinc-400">${escapeHtml(u.email)}</td>
                    <td class="text-zinc-400">${u.posts_count || 0} posts · ${u.friends_count || 0} friends</td>
                    <td>
                      <div class="flex flex-wrap gap-1.5">
                        ${(u.avatar_url || u.bio) ? `
                          <button onclick="handleClearUserProfile('${escapeHtml(u.id)}', '${escapeHtml(u.handle)}', true, true)" class="mod-btn px-2.5 py-1.5 rounded-lg bg-zinc-800 text-zinc-200 text-xs font-semibold">
                            Clear Photo/Bio
                          </button>
                        ` : ''}
                        <button onclick="if(confirm('Remove @${escapeHtml(u.handle)} and all their posts?'))handleDeleteUser('${escapeHtml(u.id)}', '${escapeHtml(u.handle)}')" class="mod-btn px-3 py-1.5 rounded-lg bg-rose-600/90 text-white text-xs font-semibold">
                          Remove Account
                        </button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      root.innerHTML = `
        <header class="pb-5 border-b border-zinc-900 flex flex-wrap items-center justify-between gap-4">
          <div>
            <h1 class="text-2xl font-bold tracking-tight" style="font-family: Georgia, serif;">Ivris Moderation Console</h1>
            <p class="text-xs text-zinc-400">Signed in as <span class="text-white font-semibold">@${escapeHtml(modState.moderator.handle)}</span> · Teen &amp; Adult Safety Active</p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <button onclick="toggleModTheme()" class="mod-btn px-3 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-xs font-semibold">
              ${isLight ? '🌙 Dark' : '☀️ Light'}
            </button>
            <button id="mod-sync-btn" onclick="handleSyncUpstream()" class="mod-btn px-3.5 py-2 rounded-xl bg-sky-500/20 border border-sky-500/40 text-sky-300 text-xs font-semibold flex items-center gap-1.5" title="Synchronize accounts and posts with production cloud server">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
              <span>Sync Cloud Database</span>
            </button>
            <a href="/api/admin/backup/download" download class="mod-btn px-3.5 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-xs font-semibold text-white flex items-center gap-1.5" title="Download SQLite database snapshot">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span>Download .db</span>
            </a>
            <button onclick="loadDashboard()" class="mod-btn px-3.5 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-xs font-semibold">
              Refresh
            </button>
            <button onclick="handleModSignOut()" class="mod-btn px-3.5 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 text-xs font-semibold">
              Sign Out
            </button>
          </div>
        </header>

        <main class="py-5 space-y-5">
          ${modState.statusBanner ? `
            <div role="status" class="p-3.5 rounded-xl bg-sky-500/15 border border-sky-500/30 text-sky-300 text-xs flex items-center justify-between">
              <span>${escapeHtml(modState.statusBanner)}</span>
              <button onclick="modState.statusBanner='';renderMod()" class="text-xs text-zinc-400 hover:text-white">Dismiss</button>
            </div>
          ` : ''}

          <nav aria-label="Moderation Views" class="flex flex-wrap gap-2">
            <button onclick="setModTab('reports')" class="mod-btn px-4 py-2 rounded-full text-xs font-semibold ${modState.activeTab === 'reports' ? 'bg-sky-500 text-white' : 'bg-zinc-900 text-zinc-300 border border-zinc-800'}">
              Post Reports (${openPostReportsCount})
            </button>
            <button onclick="setModTab('account_reports')" class="mod-btn px-4 py-2 rounded-full text-xs font-semibold ${modState.activeTab === 'account_reports' ? 'bg-sky-500 text-white' : 'bg-zinc-900 text-zinc-300 border border-zinc-800'}">
              Account Reports (${openAccountReportsCount})
            </button>
            <button onclick="setModTab('users')" class="mod-btn px-4 py-2 rounded-full text-xs font-semibold ${modState.activeTab === 'users' ? 'bg-sky-500 text-white' : 'bg-zinc-900 text-zinc-300 border border-zinc-800'}">
              Accounts (${modState.users.length})
            </button>
            <button onclick="setModTab('posts')" class="mod-btn px-4 py-2 rounded-full text-xs font-semibold ${modState.activeTab === 'posts' ? 'bg-sky-500 text-white' : 'bg-zinc-900 text-zinc-300 border border-zinc-800'}">
              All Active Posts (${modState.activePosts.length})
            </button>
            <button onclick="setModTab('logs')" class="mod-btn px-4 py-2 rounded-full text-xs font-semibold ${modState.activeTab === 'logs' ? 'bg-sky-500 text-white' : 'bg-zinc-900 text-zinc-300 border border-zinc-800'}">
              Audit Log (${autoNudityCount} auto-deleted)
            </button>
          </nav>

          ${tabContent}
        </main>
      `;
    }

    loadDashboard();
  </script>
</body>
</html>
